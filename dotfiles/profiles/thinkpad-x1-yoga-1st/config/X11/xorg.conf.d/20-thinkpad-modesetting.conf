# ThinkPad X1 Yoga 1st generation — Intel HD Graphics 520.
#
# Xorg usa el driver modesetting sobre i915. DRI3 es el camino de
# presentación esperado; PageFlip lo deja explícito para esta configuración.
# No usar el DDX intel de la MacBook en este equipo.

# BEGIN rafex thinkpad dri3
Section "Device"
    Identifier "ThinkPad Intel HD Graphics 520"
    Driver "modesetting"
    Option "AccelMethod" "glamor"
    Option "PageFlip" "on"
EndSection
# END rafex thinkpad dri3
