# Managed by rafex install_picom_upstream_linux.sh
# Picom upstream v13 para Xorg + i3/Openbox en la ThinkPad.

backend = "glx";
vsync = true;
use-damage = true;
dithered-present = false;

# Sombra deliberadamente pequeña y tenue.
shadow = true;
shadow-radius = 5;
shadow-opacity = 0.22;
shadow-offset-x = -2;
shadow-offset-y = -2;
shadow-color = "#000000";

# Transiciones discretas.
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
detect-client-opacity = true;
detect-transient = true;
detect-rounded-corners = true;
unredir-if-possible = false;

# Desenfoque GPU para ventanas con transparencia. Si produce artefactos o
# consumo excesivo en una sesión, se desactiva blur-background en la regla.
blur-method = "dual_kawase";
blur-strength = 4;
blur-background-fixed = true;
blur-kern = "3x3box";

corner-radius = 7;

# Las ventanas normales son ligeramente translúcidas; Firefox conserva casi
# toda su opacidad para no degradar lectura de páginas y vídeo.
rules: (
  {
    match = "window_type = 'desktop' || window_type = 'dock' || window_type = 'notification' || class_g = 'Conky' || class_g = 'Eww'";
    shadow = false;
    opacity = 1.0;
    blur-background = false;
    corner-radius = 0;
  },
  {
    match = "window_type = 'normal'";
    shadow = true;
    opacity = 0.97;
    blur-background = true;
    corner-radius = 7;
  },
  {
    match = "window_type = 'dialog' || window_type = 'utility'";
    shadow = true;
    opacity = 0.96;
    blur-background = true;
    corner-radius = 7;
  },
  {
    match = "class_g = 'Alacritty'";
    opacity = 0.93;
    blur-background = true;
    shader = "shaders/nord.glsl";
  },
  {
    match = "class_g = 'Firefox'";
    opacity = 0.98;
    blur-background = false;
  },
  {
    match = "class_g = 'Thunar'";
    opacity = 0.96;
    blur-background = true;
  },
  {
    match = "class_g = 'Notification' || window_type = 'menu' || window_type = 'popup_menu' || window_type = 'tooltip'";
    shadow = false;
    opacity = 0.95;
    blur-background = true;
    corner-radius = 6;
  }
)
