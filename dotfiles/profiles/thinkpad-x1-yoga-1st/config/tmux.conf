# BEGIN terminal-workstation tmux
# tmux developer adaptado desde development-environment-rafex.
set -g prefix C-b
bind C-b send-prefix
set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-256color:RGB"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides "*:Ss=\E[%p1%d q:Se=\E[ q"
set -s escape-time 0
set -g mouse on
set -g history-limit 100000
set -g base-index 0
set -g pane-base-index 0
set -g renumber-windows on
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format '#{b:pane_current_path}  #{pane_current_command}'
set -g set-titles on
set -g set-titles-string '#{session_name} — #{pane_current_command}'
set -g focus-events on
set -g status-interval 2

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %
bind N command-prompt -p "Nombre de la ventana:" "new-window -n '%%' -c '#{pane_current_path}'"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind m resize-pane -Z

bind -n M-Left previous-window
bind -n M-Right next-window
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

set-window-option -g mode-keys vi
set -g set-clipboard on
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "pbcopy 2>/dev/null || xclip -selection clipboard 2>/dev/null || xsel --clipboard --input"
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line
bind -T copy-mode-vi / command-prompt -p "Buscar:" "send -X search-forward '%%'"

bind D run-shell "tmux split-window -h -l 40 -c '#{pane_current_path}' && tmux select-pane -L"
bind G run-shell "tmux split-window -h -p 35 -c '#{pane_current_path}' && tmux split-window -v -p 50 -c '#{pane_current_path}' && tmux select-pane -t 1"
bind r source-file ~/.tmux.conf \; display-message "Configuracion recargada"
bind S setw synchronize-panes \; display-message "sync: #{?synchronize-panes,ON,OFF}"
bind e new-window -n 'config' "nvim ~/.tmux.conf"
bind C-s choose-tree -sZ
bind X confirm-before -p "Matar sesion?" kill-session

if-shell '[ -f "$HOME/.config/rafex/themes/current/tmux.conf" ]' 'source-file ~/.config/rafex/themes/current/tmux.conf'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-urlview'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @tmux-fzf-launch-key 'F'
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
# END terminal-workstation tmux
