# =============================================================================
# tmux / rafex-developer — Perfil ThinkPad para Debian, SSH y Mosh.
# =============================================================================

# Prefijo
set -g prefix C-b
bind C-b send-prefix

# Terminal y compatibilidad OSC52/TrueColor
set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-256color:RGB"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ag terminal-features ",xterm-kitty:RGB"
set -ga terminal-overrides ",xterm-kitty:Tc"
set -ag terminal-features ",rxvt-unicode-256color:RGB"
set -ga terminal-overrides ",rxvt-unicode-256color:Tc"
set -ga terminal-overrides "*:Ss=\E[%p1%d q:Se=\E[ q"
set -s escape-time 0

# Comportamiento general
set -g mouse on
set -g history-limit 100000
set -g base-index 0
set -g pane-base-index 0
set -g renumber-windows on
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}  #{pane_current_command}'
set -g set-titles on
set -g set-titles-string '#{session_name} — #{pane_current_command}'
set -g focus-events on
set -g status-interval 2

# Splits y ventanas en el directorio actual
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %
bind N command-prompt -p "Nombre de la ventana:" "new-window -n '%%' -c '#{pane_current_path}'"

# Navegación Vim y cambio de ventanas
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-Left previous-window
bind -n M-Right next-window
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Redimensionar y maximizar paneles
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind m resize-pane -Z

# Copia vi y portapapeles local/remoto
setw -g mode-keys vi
set -g set-clipboard on
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \
  "pbcopy 2>/dev/null || xclip -selection clipboard 2>/dev/null || xsel --clipboard --input"
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line
bind -T copy-mode-vi / command-prompt -p "Buscar:" "send -X search-forward '%%'"

# Layouts de desarrollo
bind D run-shell "tmux split-window -h -l 40 -c '#{pane_current_path}' && tmux select-pane -L"
bind G run-shell "tmux split-window -h -p 35 -c '#{pane_current_path}' && tmux split-window -v -p 50 -c '#{pane_current_path}' && tmux select-pane -t 1"

# Miscelánea
bind r source-file ~/.tmux.conf \; display-message "Configuración recargada"
bind S setw synchronize-panes \; display-message "sync: #{?synchronize-panes,ON,OFF}"
bind e new-window -n 'config' "nvim ~/.tmux.conf"
bind C-s choose-tree -sZ
bind X confirm-before -p "¿Matar sesión?" kill-session

# Paleta rafex-modern de alto contraste
RM_BG="#1e1e2e"
RM_SURFACE="#313244"
RM_OVERLAY="#45475a"
RM_FG="#cdd6f4"
RM_DIM="#6c7086"
RM_BLUE="#89b4fa"
RM_CYAN="#89dceb"
RM_GREEN="#a6e3a1"
RM_YELLOW="#f9e2af"
RM_PEACH="#fab387"
RM_RED="#f38ba8"
RM_DARK="#11111b"

set -g pane-border-style "fg=$RM_SURFACE"
set -g pane-active-border-style "fg=$RM_BLUE"
set -g message-style "fg=$RM_DARK,bg=$RM_PEACH,bold"
set -g message-command-style "fg=$RM_DARK,bg=$RM_CYAN"
set -g mode-style "fg=$RM_DARK,bg=$RM_CYAN"

# Barra de estado: sesión, ventanas, directorio, Git y hora
set -g status on
set -g status-position bottom
set -g status-style "bg=$RM_BG,fg=$RM_FG"
set -g status-left-length 80
set -g status-right-length 160
set -g status-left "#[fg=$RM_DARK,bg=$RM_BLUE,bold]  #S #[fg=$RM_BLUE,bg=$RM_BG]#{?window_zoomed_flag,#[fg=$RM_DARK,bg=$RM_YELLOW] zoom #[fg=$RM_YELLOW,bg=$RM_BG],} "
set -g status-justify left
setw -g window-status-format \
  "#[fg=$RM_DIM,bg=$RM_BG] #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-current-format \
  "#[fg=$RM_BG,bg=$RM_PEACH,bold] #I:#W#{?window_flags,#{window_flags},} #[fg=$RM_PEACH,bg=$RM_BG]"
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=$RM_YELLOW,bg=$RM_BG"
set -g status-right "#[fg=$RM_GREEN,bg=$RM_BG] #{?#{==:#{pane_current_command},nvim},,#{b:pane_current_path}} #[fg=$RM_FG,bg=$RM_OVERLAY] #(cd #{pane_current_path} && git branch --show-current 2>/dev/null | head -1) #[fg=$RM_BG,bg=$RM_CYAN,bold]  %H:%M #[fg=$RM_CYAN,bg=$RM_RED]#[fg=$RM_DARK,bg=$RM_RED,bold] %d/%m "

# TPM y plugins de desarrollo
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-urlview'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Inicializar TPM al final; Ctrl-b I instala o actualiza plugins.
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
