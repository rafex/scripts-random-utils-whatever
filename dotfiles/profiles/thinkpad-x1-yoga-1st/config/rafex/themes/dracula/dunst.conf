[global]
monitor = 0
follow = mouse
origin = top-right
offset = (10, 10)
width = 300
height = (0, 300)
transparency = 5
frame_width = 1
separator_height = 2
padding = 8
horizontal_padding = 8
font = DejaVu Sans Mono 10
markup = yes
word_wrap = yes
corner_radius = 6

[urgency_low]
background = "#282a36"
foreground = "#bdc3e6"
frame_color = "#6272a4"
timeout = 5

[urgency_normal]
background = "#44475a"
foreground = "#f8f8f2"
frame_color = "#bd93f9"
timeout = 6

[urgency_critical]
background = "#5c2020"
foreground = "#ffb3b3"
frame_color = "#ff5555"
timeout = 0
