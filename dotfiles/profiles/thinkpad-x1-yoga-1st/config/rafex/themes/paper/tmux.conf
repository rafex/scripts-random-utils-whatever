# Rafex Paper: claro cálido.
set -g pane-border-style "fg=#a69b8f"
set -g pane-active-border-style "fg=#b45f06"
set -g message-style "fg=#2d2a26,bg=#f0d8b5,bold"
set -g message-command-style "fg=#2d2a26,bg=#ead0aa"
set -g mode-style "fg=#2d2a26,bg=#ead0aa"
set -g status-style "bg=#f7f1e8,fg=#2d2a26"
set -g status-left-length 80
set -g status-right-length 160
set -g status-left "#[fg=#fffaf2,bg=#b45f06,bold] #S #[fg=#b45f06,bg=#f7f1e8]#{?window_zoomed_flag,#[fg=#2d2a26,bg=#f0d8b5] zoom ,}"
set -g status-right "#[fg=#665e56] #{b:pane_current_path} #[fg=#b45f06] %H:%M #[fg=#665e56] %d/%m"
setw -g window-status-format "#[fg=#665e56,bg=#f7f1e8] #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-current-format "#[fg=#fffaf2,bg=#b45f06,bold] #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#8a4b08,bg=#f7f1e8"
