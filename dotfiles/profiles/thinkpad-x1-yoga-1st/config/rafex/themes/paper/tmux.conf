# Rafex Paper: terminal oscuro cálido.
set -g pane-border-style "fg=#6b7280"
set -g pane-active-border-style "fg=#b45f06"
set -g message-style "fg=#fffaf2,bg=#6f4c2a,bold"
set -g message-command-style "fg=#fffaf2,bg=#57402c"
set -g mode-style "fg=#fffaf2,bg=#57402c"
set -g status-style "bg=#1f2329,fg=#fffaf2"
set -g status-left-length 80
set -g status-right-length 160
set -g status-left "#[fg=#fffaf2,bg=#b45f06,bold] #S #[fg=#b45f06,bg=#1f2329]#{?window_zoomed_flag,#[fg=#fffaf2,bg=#6f4c2a] zoom ,}"
set -g status-right "#[fg=#a69b8f] #{b:pane_current_path} #[fg=#b45f06] %H:%M #[fg=#a69b8f] %d/%m"
setw -g window-status-format "#[fg=#a69b8f,bg=#1f2329] #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-current-format "#[fg=#fffaf2,bg=#b45f06,bold] #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#b45f06,bg=#1f2329"
