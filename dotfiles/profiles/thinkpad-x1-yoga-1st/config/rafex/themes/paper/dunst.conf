[global]
monitor = 0
follow = mouse
origin = top-right
offset = (10, 10)
width = 300
height = (0, 300)
transparency = 5
frame_width = 1
separator_height = 2
padding = 8
horizontal_padding = 8
font = DejaVu Sans Mono 10
markup = yes
word_wrap = yes
corner_radius = 6

[urgency_low]
background = "#f7f1e8"
foreground = "#665e56"
frame_color = "#a69b8f"
timeout = 5

[urgency_normal]
background = "#f0d8b5"
foreground = "#2d2a26"
frame_color = "#b45f06"
timeout = 6

[urgency_critical]
background = "#ffdad4"
foreground = "#690005"
frame_color = "#b3261e"
timeout = 0
