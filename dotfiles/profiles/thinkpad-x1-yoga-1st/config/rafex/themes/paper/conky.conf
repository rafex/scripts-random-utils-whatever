conky.config = {
    alignment = 'top_left',
    background = false,
    border_width = 1,
    cpu_avg_samples = 2,
    -- BEGIN rafex theme
    default_color = '#ffffff',
    color1 = '#fff3a3',
    color2 = '#eaf4ff',
    color3 = '#ffb39b',
    -- END rafex theme
    draw_borders = false,
    draw_graph_borders = false,
    draw_shades = false,
    double_buffer = true,
    font = 'DejaVu Sans Mono:size=11',
    gap_x = 18,
    gap_y = 34,
    minimum_width = 320,
    maximum_width = 320,
    minimum_height = 1030,
    own_window = true,
    own_window_colour = '#00000000',
    own_window_class = 'RafexConky',
    own_window_title = 'Rafex ThinkPad Monitor',
    own_window_hints = 'undecorated,above,sticky,skip_taskbar,skip_pager',
    own_window_type = 'desktop',
    update_interval = 3,
    update_interval_on_battery = 10,
    use_xft = true,
    xinerama_head = 0,
}

conky.text = [[
${color1}${font DejaVu Sans Mono:bold:size=13}RAFEX · THINKPAD X1 YOGA${font}${color}
${color2}${hr 2}${color}
${color1}SISTEMA${color}
Kernel: ${kernel}
Uptime: ${uptime_short}  Escritorio: ${desktop_name}
CPU: ${cpu cpu0}%  Carga: ${loadavg 1}
${cpubar 6}
RAM: ${memperc}%  ${mem}/${memmax}
${membar 6}
Swap: ${swapperc}%  Disco /: ${fs_used_perc /}%
Libre: ${fs_free /} / ${fs_size /}

${color1}HARDWARE Y ENERGÍA${color}
${execi 10 ~/.local/bin/conky-status.sh --temperature}
${execi 10 ~/.local/bin/conky-status.sh --power}

${color1}RED${color}
${execi 10 ~/.local/bin/conky-status.sh --network}

${color1}AUDIO${color}
${execi 10 ~/.local/bin/conky-status.sh --audio}

${color1}LABORATORIO${color}
${execi 30 ~/.local/bin/conky-status.sh --lab}

${color1}SEGURIDAD${color}
${execi 30 ~/.local/bin/conky-status.sh --security}

${color2}Tema: ${execi 30 sh -c 'head -n 1 "$HOME/.config/rafex/theme" 2>/dev/null || printf N/D'}${color}
${color2}${time %Y-%m-%d %H:%M}${color}
]]
