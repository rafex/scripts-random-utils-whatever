# Paleta oscura de alto contraste de tmux.
set -g pane-border-style "fg=#6e7681"
set -g pane-active-border-style "fg=#58a6ff"
set -g message-style "fg=#0d1117,bg=#79c0ff,bold"
set -g message-command-style "fg=#0d1117,bg=#a5d6ff"
set -g mode-style "fg=#0d1117,bg=#a5d6ff"
set -g status-style "bg=#161b22,fg=#f0f6fc"
set -g status-left-length 80
set -g status-right-length 160
set -g status-left "#[fg=#0d1117,bg=#58a6ff,bold] #S #[fg=#58a6ff,bg=#161b22]#{?window_zoomed_flag,#[fg=#0d1117,bg=#79c0ff] zoom ,}"
set -g status-right "#[fg=#8b949e] #{b:pane_current_path} #[fg=#58a6ff] %H:%M #[fg=#8b949e] %d/%m"
setw -g window-status-format "#[fg=#8b949e,bg=#161b22] #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-current-format "#[fg=#0d1117,bg=#58a6ff,bold] #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#e3b341,bg=#161b22"
