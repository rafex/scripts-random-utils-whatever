[global]
monitor = 0
follow = mouse
origin = top-right
offset = (10, 10)
width = 300
height = (0, 300)
transparency = 10
frame_width = 1
separator_height = 2
padding = 8
horizontal_padding = 8
font = DejaVu Sans Mono 10
markup = yes
word_wrap = yes
corner_radius = 6

[urgency_low]
background = "#161b22"
foreground = "#8b949e"
frame_color = "#6e7681"
timeout = 5

[urgency_normal]
background = "#1f6feb"
foreground = "#ffffff"
frame_color = "#58a6ff"
timeout = 6

[urgency_critical]
background = "#490202"
foreground = "#ff7b72"
frame_color = "#da3633"
timeout = 0
