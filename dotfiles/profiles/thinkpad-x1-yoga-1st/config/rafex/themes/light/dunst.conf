[global]
monitor = 0
follow = mouse
origin = top-right
offset = (10, 10)
width = 300
height = (0, 300)
transparency = 10
frame_width = 1
separator_height = 2
padding = 8
horizontal_padding = 8
font = DejaVu Sans Mono 10
markup = yes
word_wrap = yes
corner_radius = 6

[urgency_low]
background = "#f6f8fa"
foreground = "#57606a"
frame_color = "#8c959f"
timeout = 5

[urgency_normal]
background = "#ddf4ff"
foreground = "#24292f"
frame_color = "#0969da"
timeout = 6

[urgency_critical]
background = "#ffebe9"
foreground = "#82071e"
frame_color = "#cf222e"
timeout = 0
