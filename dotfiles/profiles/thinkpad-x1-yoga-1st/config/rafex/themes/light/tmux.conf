# Paleta clara de tmux.
set -g pane-border-style "fg=#8c959f"
set -g pane-active-border-style "fg=#0969da"
set -g message-style "fg=#24292f,bg=#ddf4ff,bold"
set -g message-command-style "fg=#24292f,bg=#b6e3ff"
set -g mode-style "fg=#24292f,bg=#b6e3ff"
set -g status-style "bg=#f6f8fa,fg=#24292f"
set -g status-left-length 80
set -g status-right-length 160
set -g status-left "#[fg=#ffffff,bg=#0969da,bold] #S #[fg=#0969da,bg=#f6f8fa]#{?window_zoomed_flag,#[fg=#24292f,bg=#ddf4ff] zoom ,}"
set -g status-right "#[fg=#57606a] #{b:pane_current_path} #[fg=#0969da] %H:%M #[fg=#57606a] %d/%m"
setw -g window-status-format "#[fg=#57606a,bg=#f6f8fa] #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-current-format "#[fg=#ffffff,bg=#0969da,bold] #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#9a6700,bg=#f6f8fa"
