[global]
monitor = 0
follow = mouse
origin = top-right
offset = (10, 10)
width = 300
height = (0, 300)
transparency = 5
frame_width = 1
separator_height = 2
padding = 8
horizontal_padding = 8
font = DejaVu Sans Mono 10
markup = yes
word_wrap = yes
corner_radius = 6

[urgency_low]
background = "#f3f1dc"
foreground = "#708089"
frame_color = "#9da9a0"
timeout = 5

[urgency_normal]
background = "#e7e4c9"
foreground = "#3c4841"
frame_color = "#8da101"
timeout = 6

[urgency_critical]
background = "#ffd9d5"
foreground = "#8c2f2f"
frame_color = "#f85552"
timeout = 0
