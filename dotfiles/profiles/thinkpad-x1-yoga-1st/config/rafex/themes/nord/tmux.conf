# Rafex Nord: terminal oscuro azul grisáceo.
set -g pane-border-style "fg=#7b88a1"
set -g pane-active-border-style "fg=#5e81ac"
set -g message-style "fg=#2e3440,bg=#88c0d0,bold"
set -g message-command-style "fg=#eceff4,bg=#4c566a"
set -g mode-style "fg=#eceff4,bg=#4c566a"
set -g status-style "bg=#2e3440,fg=#eceff4"
set -g status-left-length 80
set -g status-right-length 160
set -g status-left "#[fg=#eceff4,bg=#5e81ac,bold] #S #[fg=#5e81ac,bg=#2e3440]#{?window_zoomed_flag,#[fg=#2e3440,bg=#88c0d0] zoom ,}"
set -g status-right "#[fg=#4c566a] #{b:pane_current_path} #[fg=#5e81ac] %H:%M #[fg=#4c566a] %d/%m"
setw -g window-status-format "#[fg=#7b88a1,bg=#2e3440] #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-current-format "#[fg=#eceff4,bg=#5e81ac,bold] #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#ebcb8b,bg=#2e3440"
