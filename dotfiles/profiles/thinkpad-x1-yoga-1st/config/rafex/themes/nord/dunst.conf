[global]
monitor = 0
follow = mouse
origin = top-right
offset = (10, 10)
width = 300
height = (0, 300)
transparency = 5
frame_width = 1
separator_height = 2
padding = 8
horizontal_padding = 8
font = DejaVu Sans Mono 10
markup = yes
word_wrap = yes
corner_radius = 6

[urgency_low]
background = "#e5e9f0"
foreground = "#4c566a"
frame_color = "#7b88a1"
timeout = 5

[urgency_normal]
background = "#d8dee9"
foreground = "#2e3440"
frame_color = "#5e81ac"
timeout = 6

[urgency_critical]
background = "#f3d0d4"
foreground = "#6f1d27"
frame_color = "#bf616a"
timeout = 0
