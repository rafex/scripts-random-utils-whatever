# Polybar completo para i3. Los clics solo llaman helpers del perfil Rafex.

# BEGIN rafex polybar theme
[colors]
background = #e5e9f0
foreground = #2e3440
separator = #7b88a1
active = #5e81ac
active-foreground = #eceff4
inactive = #d8dee9
inactive-foreground = #4c566a
urgent = #bf616a
urgent-foreground = #eceff4
# END rafex polybar theme

[bar/rafex]
width = 100%
height = 28pt
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2pt
border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = DejaVu Sans Mono:size=9;2
font-1 = Font Awesome 7 Free Solid:size=9;2
modules-left = i3 xwindow
modules-right = keyboard network-wifi network-wired pulseaudio brightness keyboard-brightness microphone panel screenshot power battery date tray
wm-restack = i3
enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
wrapping-scroll = false
enable-click = true
enable-scroll = true
label-focused = %name%
label-focused-background = ${colors.active}
label-focused-foreground = ${colors.active-foreground}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${colors.inactive-foreground}
label-unfocused-padding = 1
label-visible = %name%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.urgent}
label-urgent-foreground = ${colors.urgent-foreground}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:…%
label-empty = Escritorio
label-empty-foreground = ${colors.inactive-foreground}

[module/network-wifi]
type = internal/network
interface-type = wireless
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected =  conectado
label-disconnected =  desconectado
label-disconnected-foreground = ${colors.inactive-foreground}

[module/network-wired]
type = internal/network
interface-type = wired
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected =  cable
label-disconnected =  sin cable
label-disconnected-foreground = ${colors.inactive-foreground}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5
format-volume = <ramp-volume> <label-volume>
format-muted = <label-muted>
label-volume = %percentage%%
label-muted =  silenciado
label-muted-foreground = ${colors.inactive-foreground}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
click-right = ~/.local/bin/volume-notify.sh mute
scroll-up = ~/.local/bin/volume-notify.sh up
scroll-down = ~/.local/bin/volume-notify.sh down

[module/brightness]
type = custom/text
format = 
content-foreground = ${colors.foreground}
click-left = ~/.local/bin/brightness-notify.sh up
click-right = ~/.local/bin/brightness-notify.sh down

[module/keyboard-brightness]
type = custom/text
format = 
content-foreground = ${colors.foreground}
click-left = ~/.local/bin/kbd-brightness-notify.sh up
click-right = ~/.local/bin/kbd-brightness-notify.sh down

[module/microphone]
type = custom/text
format = 
content-foreground = ${colors.foreground}
click-left = ~/.local/bin/microphone-notify.sh toggle

[module/panel]
type = custom/text
format = ⚙
content-foreground = ${colors.foreground}
click-left = ~/.local/bin/rafex-control-panel.sh

[module/screenshot]
type = custom/text
format = 
content-foreground = ${colors.foreground}
click-left = ~/.local/bin/screenshot.sh --full
click-right = ~/.local/bin/screenshot.sh --select

[module/power]
type = custom/text
format = 
content-foreground = ${colors.foreground}
click-left = ~/.local/bin/desktop-settings-menu.sh

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 5
time-format = %H:%M
format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
label-charging =  %percentage%%
label-discharging =  %percentage%%
label-full =  llena
label-charging-foreground = ${colors.foreground}
label-discharging-foreground = ${colors.foreground}
label-full-foreground = ${colors.foreground}

[module/tray]
type = internal/tray
format = <tray>
tray-size = 66%
tray-spacing = 2px

[module/keyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-indicator-on = %name%

[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
label = %date%  %time%
