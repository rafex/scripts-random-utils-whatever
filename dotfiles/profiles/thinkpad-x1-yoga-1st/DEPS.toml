# ThinkPad X1 Yoga 1st generation — Debian + i3/Xorg.
# La política Xorg explícita se aplica por separado con
# configure-thinkpad-xorg-dri3; no se instala automáticamente con el perfil.

[packages]
apt = [
    "i3-wm",
    "i3status",
    "rofi",
    "9menu",
    "ratmenu",
    "dunst",
    "alacritty",
    "rxvt-unicode",
    "picom",
    "feh",
    "maim",
    "slop",
    "xclip",
    "copyq",
    "brightnessctl",
    "pavucontrol",
    "pasystray",
    "lxpolkit",
    "synaptic",
    "fonts-font-awesome",
    "fonts-noto-color-emoji",
    "x11-xserver-utils",
    "x11-xkb-utils",
    "xss-lock",
    "i3lock",
    "dex",
    "libnotify-bin",
    "autorandr",
    "python3-gi",
    "gir1.2-gtk-3.0",
    "playerctl",
]

[files]
portable = [
    "config/i3",
    "config/i3status",
    "config/rofi",
    "config/9menu",
    "config/dunst",
    "config/alacritty",
    "config/picom",
    "config/udiskie",
    "config/Xresources",
    "config/rafex",
    "config/eww",
    "config/tmux.conf",
]

[xorg]
# Archivo específico de la ThinkPad; requiere sudo y reinicio de la sesión Xorg.
system_files = [
    "/etc/X11/xorg.conf.d/20-thinkpad-modesetting.conf",
    "/etc/X11/xorg.conf.d/40-rafex-libinput-touchpad.conf",
]

[excluded]
hardware_specific = [
    "config/X11/xorg.conf.d/40-libinput.conf",
    "config/autorandr/mirror",
]
