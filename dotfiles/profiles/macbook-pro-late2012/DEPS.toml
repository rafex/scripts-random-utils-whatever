# Perfil: macbook-pro-late2012
# MacBook Pro (Retina, 13-inch, Late 2012) — Debian 13 (trixie) + i3/Xorg
#
# Hardware: Intel Core i5-3210M @ 2.50GHz, 8 GB RAM, Intel HD 4000
# Pantalla: 13.3" (1280x800), DPI 76
# Almacenamiento: Crucial CT480M500SSD1 480GB SATA SSD
# Gráficos: Intel 3rd Gen Core (ivybridge), backend GLX
# SDDM no usado — arranque vía LightDM + ~/.xsession

[packages]
apt = [
    "i3-wm",
    "i3status",
    "rofi",
    "dunst",
    "alacritty",
    "picom",
    "feh",
    "maim",
    "brightnessctl",
    "volumeicon-alsa",
    "network-manager-gnome",
    "x11-xserver-utils",
    "x11-xkb-utils",
    "xss-lock",
    "i3lock",
    "dex",
    "udiskie",
    "udisks2",
]

[files]
# Archivos externos referenciados por los configs del perfil.
# El instalador los copia automáticamente si existen en el repositorio principal.

[files.wallpaper]
path = "~/Imágenes/FondosDePantalla/wp15986180-debian-13-wallpapers.jpg"
description = "Wallpaper de Debian 13 (no incluido en el perfil)"
source = "externo"        # el usuario debe copiarlo manualmente

[files.scripts]
# Scripts de ~/.local/bin/ mapeados al repositorio principal.
# El instalador los copia desde scripts/ del repo si están disponibles.
"brightness-notify.sh"     = { source = "scripts/hardware/notify_brightness_linux.sh" }
"volume-notify.sh"         = { source = "scripts/hardware/notify_volume_linux.sh" }
"kbd-brightness-notify.sh" = { source = "scripts/hardware/notify_kbd_brightness_linux.sh" }
"power-notify.sh"          = { source = "scripts/hardware/notify_power_linux.sh" }
"screensaver-toggle"       = { source = "scripts/hardware/screensaver_toggle_linux.sh" }
"hidpi_xorg.sh"            = { source = "scripts/display/hidpi_xorg_linux.sh" }
"usb-mount-perms"          = { source = "scripts/hardware/usb_mount_perms_linux.sh" }

[polkit]
# Reglas de polkit para montaje USB sin sudo.
# Aplica: usb-mount-perms --fix (requiere sudo, ejecutar una sola vez).
rules = [
    "/etc/polkit-1/rules.d/10-udisks2-mount.rules",
]
helper_script = "scripts/hardware/usb_mount_perms_linux.sh"
