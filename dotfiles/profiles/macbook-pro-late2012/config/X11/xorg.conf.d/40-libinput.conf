# Trackpad MacBook Pro Late 2012 — comportamiento estilo macOS
Section "InputClass"
    Identifier "libinput touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"

    # Tap to click
    Option "Tapping" "on"

    # Natural scrolling (tipo macOS)
    Option "NaturalScrolling" "true"

    # Scroll con dos dedos
    Option "ScrollMethod" "twofinger"

    # Velocidad del cursor (-1.0 lento → 1.0 rápido)
    Option "AccelSpeed" "0.3"

    # Palm detection
    Option "PalmDetection" "on"

    # Click físico: izquierda / derecha
    Option "ClickMethod" "clickfinger"

    # Evita movimientos erráticos al escribir
    Option "DisableWhileTyping" "true"
EndSection
