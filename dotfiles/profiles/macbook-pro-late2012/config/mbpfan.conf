[general]
# Control térmico para MacBookPro10,2 mediante applesmc.
# No se fijan RPM: mbpfan usa los límites publicados por el firmware.
# La respuesta comienza antes de la zona caliente y el límite evita acercarse
# al máximo térmico del procesador.
low_temp = 55
high_temp = 65
max_temp = 85
polling_interval = 1
