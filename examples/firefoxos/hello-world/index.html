<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rafex · Hola Mundo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <p class="eyebrow">RAFEX · LABORATORIO</p>
    <h1>Hola, Flame</h1>
    <p class="lead">Esta es una aplicación Firefox OS empaquetada localmente.</p>

    <section class="card" aria-labelledby="status-title">
      <h2 id="status-title">Prueba de interacción</h2>
      <p>Funciona sin red, sin cuentas y sin permisos especiales.</p>
      <button id="hello-button" type="button">Probar interacción</button>
      <p id="status" class="status" role="status" aria-live="polite">Listo para probar.</p>
    </section>

    <p class="footer">Mozilla Flame · Firefox OS legado · v1.0.0</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
