# CONFIG.toml — Entry point for deployment configuration.
# This file references other configuration files with specific purposes.

# Script-to-remote-name mapping and host definitions
paths = "PATH.toml"

# Checksums file (generated by: make checksums)
checksums = "SHA256SUMS"

# Dotfiles profiles (each has its own DEPS.toml)
[profiles]
"default" = "dotfiles/profiles/default/DEPS.toml"
"macbook-pro-late2012" = "dotfiles/profiles/macbook-pro-late2012/DEPS.toml"
